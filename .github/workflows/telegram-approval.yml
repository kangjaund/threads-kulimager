name: Telegram approval queue

on:
  schedule:
    # Poll Telegram every 5 minutes. GitHub cron uses UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-approval
  cancel-in-progress: false

jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Process Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_approval.py

      - name: Commit approval state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add data/posts.json data/telegram_offset.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan approval state."
          else
            git commit -m "chore: update Telegram approval queue"
            git pull --rebase --autostash
            git push
          fi
