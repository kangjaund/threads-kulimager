name: Generate konten

on:
  schedule:
    # 08:00 WIB setiap hari. GitHub cron memakai UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posts-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate + quality gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/generate.py

      - name: Commit antrean
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add data/posts.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan antrean."
          else
            git commit -m "chore: update antrean posts"
            git pull --rebase --autostash
            git push
          fi
