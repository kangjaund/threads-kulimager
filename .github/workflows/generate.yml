name: Generate konten

on:
  schedule:
    # 08:00 WIB setiap hari. GitHub cron memakai UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      query_group:
        description: "Grup query Threads (auto = rotasi, atau A / B / C / D / E)"
        required: false
        default: "auto"

permissions:
  contents: write

# Semua workflow yang menulis data/posts.json memakai group yang sama.
concurrency:
  group: posts-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Kumpulkan sinyal research (RSS/web/Threads). Kalau gagal sebagian, generate tetap jalan
      # dengan data research yang sudah tersimpan.
      - name: Research
        continue-on-error: true
        env:
          THREADS_QUERY_GROUP: ${{ github.event.inputs.query_group || 'auto' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python src/research.py

      - name: Generate + quality gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/generate.py

      # Kirim draft baru ke Telegram. Kalau Telegram bermasalah, workflow tetap lanjut
      # dan draft akan dikirim pada run berikutnya.
      - name: Kirim draft ke Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_approval.py

      - name: Commit antrean
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan antrean."
            exit 0
          fi
          git commit -m "chore: update antrean posts"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "Push gagal (percobaan $i/5), mencoba lagi..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "Push gagal setelah 5 percobaan."
          exit 1
